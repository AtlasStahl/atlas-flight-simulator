services:
  alg:
    build: .
    ports:
      - "11434:11434"
    environment:
      - ALG_LISTEN_ADDR=:11434
      - ALG_DB_URL=file:/app/data/alg.db?_fk=1&_journal_mode=WAL&_synchronous=NORMAL
      - ALG_ADMIN_TOKEN=dev-token
      - ALG_HEALTH_INTERVAL=10s
      - ALG_INVENTORY_REFRESH=120s
      - ALG_RUNNING_REFRESH=15s
    volumes:
      - alg-data:/app/data

  # Standard test-backend (OpenAI-compatible):
  # vllm:
  #   image: vllm/vllm-openai:latest
  #   ports:
  #     - "8000:8000"
